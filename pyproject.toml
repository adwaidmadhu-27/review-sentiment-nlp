[project]
name = "review-sentiment-nlp"
version = "0.1.0"
description = "Sentiment classification of 50k IMDB movie reviews with interpretable linear models"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7", "joblib>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
